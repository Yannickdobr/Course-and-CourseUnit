server.port=3005
stripe.api.key=dummy
stripe.webhook.secret=dummy

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:eduflex_pro}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Fournisseur de paiement : simulated (defaut) | stripe | notchpay
payment.provider=${PAYMENT_PROVIDER:simulated}

# E-mails (recus). Sans cle, les mails sont journalises (mode dev).
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:EduFlex Pro <onboarding@resend.dev>}
