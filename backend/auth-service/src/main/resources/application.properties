server.port=3001

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:eduflex_pro}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# E-mails transactionnels (Resend). Sans clé, les mails sont journalisés (mode dev).
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:EduFlex Pro <onboarding@resend.dev>}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
support.email=${SUPPORT_EMAIL:support@eduflex.pro}
