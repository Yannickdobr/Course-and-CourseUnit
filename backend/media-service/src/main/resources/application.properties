server.port=3004
aws.access-key=dummy
aws.secret-key=dummy
aws.region=eu-west-1
aws.s3.bucket=dummy-bucket
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
file.upload-dir=../../uploads

# Backend de stockage : local (disque) aujourd'hui, s3 (cloud) demain.
media.storage=${MEDIA_STORAGE:local}

# Secret JWT partage avec auth-service (memes valeurs => les uploads sont authentifies).
jwt.secret=${JWT_SECRET:defaultSecretKeyWithAtLeast32CharactersLongToEnsureHS512SecurityRequirementIsMet1234567890}
